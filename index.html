<!DOCTYPE html>

<head>
  <title>todo finite</title>

  <style>
    body {
      font-family: monospace;
    }

    h1 {
      text-align: center;
    }

    #global-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin: 0px auto;
      align-content: center;
    }

    #textarea-container {
      margin: 0px auto;
    }

    #input-textarea {
      overflow: hidden;
      resize: none;
      text-wrap:unrestricted;
      word-break: break-all;
      font-size: 4em;
    }

    #char-counter {
      text-align: right;
    }
    .noselect {
      -webkit-touch-callout: none; /* iOS Safari */
      -webkit-user-select: none; /* Safari */
      -khtml-user-select: none; /* Konqueror HTML */
      -moz-user-select: none; /* Old versions of Firefox */
      -ms-user-select: none; /* Internet Explorer/Edge */
      user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
    }
  </style>
</head>

<body>
 <div id="global-container">
    <h1 class="noselect">TODO Finite</h1>
    <div id="textarea-container" >
      <textarea id="input-textarea" rows="8" cols="8" placeholder="list tasks..." ></textarea>
      <h3 id="char-counter" class="noselect">0/69</h3>
    </div>
  </div>


  <script>
    const inputArea = document.getElementById("input-textarea");
    const charCounter = document.getElementById("char-counter");

    const characterLimit = 70;
    const columnCount = 14;
    
    inputArea.cols = columnCount;
    inputArea.maxLength = characterLimit;

    var full = false;
    var currentText = "";

    update();

    inputArea.oninput = function() {
      update();
    }

    function update() {
      inputArea.style.height = "auto";
      inputArea.style.height = inputArea.scrollHeight + "px";
      updateCharCounter();
    }
    
    function updateCharCounter() {
      charCounter.innerHTML = `${inputArea.value.length}/${characterLimit}`;
    }


  </script>
</body>
